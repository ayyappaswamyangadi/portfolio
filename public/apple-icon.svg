<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0F2444"/>
      <stop offset="55%"  stop-color="#1E4DB7"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="180" height="180" rx="34" fill="url(#bg)"/>

  <!-- < bracket (left accent) -->
  <text
    x="20"
    y="102"
    font-family="'Courier New', Courier, monospace"
    font-weight="800"
    font-size="39"
    fill="white"
    opacity="0.50"
  >&lt;</text>

  <!-- A  (dominant identity letter) -->
  <text
    x="90"
    y="126"
    text-anchor="middle"
    font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
    font-weight="900"
    font-size="109"
    fill="white"
  >A</text>

  <!-- /> (right accent) -->
  <text
    x="131"
    y="102"
    font-family="'Courier New', Courier, monospace"
    font-weight="800"
    font-size="39"
    fill="white"
    opacity="0.50"
  >/&gt;</text>
</svg>
