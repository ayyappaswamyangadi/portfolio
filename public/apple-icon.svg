<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="pagebg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#0F1B2E"/>
      <stop offset="100%" stop-color="#060D18"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#EAA22F"/>
      <stop offset="100%" stop-color="#FFD28A"/>
    </linearGradient>
    <clipPath id="circle">
      <circle cx="90.0" cy="90.0" r="75.25"/>
    </clipPath>
  </defs>

  <!-- Home screen icons are captured once and dont re-evaluate media
       queries or theme toggles, so this stays fixed to the sites default
       dark theme (navy page background + gold accent ring), matching
       globals.css .dark body{} gradient and the btn-gradient custom
       property. -->
  <rect width="180" height="180" rx="34" fill="url(#pagebg)"/>
  <circle cx="90.0" cy="90.0" r="78.75" fill="none" stroke="url(#ring)" stroke-width="10"/>
  <image
    href="data:image/jpeg;base64,"
    x="14" y="14" width="152" height="152"
    clip-path="url(#circle)"
    preserveAspectRatio="xMidYMid slice"
  />
</svg>
